AllCops:
  NewCops: enable
  Exclude:
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "db/queue_schema.rb"
    - "Gemfile"
    - "lib/tasks/*.rake"
    - "bin/*"
    - "config/puma.rb"
    - "config/spring.rb"
    - "config/environments/development.rb"
    - "config/environments/production.rb"
    - "spec/spec_helper.rb"

Style/Documentation:
  Enabled: false